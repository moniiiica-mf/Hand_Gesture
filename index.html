<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASL Gesture Recognition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    #videoContainer {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; overflow: hidden;
    }

    #video {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scaleX(-1);
      min-width: 100%; min-height: 100%;
      width: auto; height: auto;
    }

    #canvas {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 10;
    }

    /* Main ASL letter badge — large, top-centre */
    #aslBadge {
      position: fixed;
      top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.82);
      border: 2px solid rgba(74,158,255,0.6);
      border-radius: 12px;
      padding: 10px 32px;
      z-index: 100;
      text-align: center;
      backdrop-filter: blur(10px);
      min-width: 160px;
    }
    #aslLetter {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      color: #fff;
      letter-spacing: 2px;
    }
    #aslConf {
      font-size: 13px;
      color: #4a9eff;
      margin-top: 2px;
    }
    #aslStable {
      font-size: 11px;
      color: #aaa;
      margin-top: 2px;
    }

    /* Stability progress bar */
    #stabilityWrap {
      width: 100%; height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px; overflow: hidden;
      margin-top: 6px;
    }
    #stabilityFill {
      height: 100%; width: 0%;
      border-radius: 2px;
      background: #4a9eff;
      transition: width 0.08s linear, background 0.25s;
    }
    /* Last committed letter */
    #lastCommit {
      font-size: 11px; color: #666;
      margin-top: 4px; min-height: 14px;
    }
    /* TTS toggle */
    #ttsToggle {
      position: fixed; bottom: 68px; right: 16px;
      background: rgba(0,0,0,0.82);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 10px; padding: 7px 14px;
      color: #888; font-size: 13px; font-weight: 600;
      cursor: pointer; z-index: 200;
      backdrop-filter: blur(10px);
      transition: border-color 0.2s, color 0.2s;
      user-select: none;
    }
    #ttsToggle.on { border-color: #4aff4a; color: #4aff4a; }
    /* Calibration hint */
    #calibHint {
      position: fixed; bottom: 120px; left: 50%;
      transform: translateX(-50%);
      background: rgba(255,170,0,0.92);
      color: #000; font-size: 13px; font-weight: 600;
      padding: 6px 18px; border-radius: 20px;
      z-index: 200; pointer-events: none;
      opacity: 0; transition: opacity 0.25s;
      white-space: nowrap;
    }
    #calibHint.show { opacity: 1; }

    /* Debug panel */
    #debugPanel {
      position: fixed; top: 10px; left: 10px;
      background: rgba(0,0,0,0.82);
      padding: 12px; border-radius: 8px;
      font-size: 11px; font-family: 'Courier New', monospace;
      max-width: 260px; z-index: 100;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .dbRow { display:flex; justify-content:space-between; margin:2px 0; }
    .dbKey { color:#888; }
    .dbVal { color:#fff; font-weight:bold; }

    /* History bar — bottom */
    #historyBar {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      border-radius: 8px; padding: 8px 20px;
      font-size: 28px; font-weight: 700;
      letter-spacing: 6px; z-index: 100;
      min-width: 300px; text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
    }

    /* Loading overlay */
    #loading {
      position: fixed; top:50%; left:50%;
      transform:translate(-50%,-50%);
      text-align:center; z-index:1000; font-size:16px;
    }
    .spinner {
      width:48px; height:48px;
      border:4px solid rgba(255,255,255,0.2);
      border-top-color:#4a9eff;
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin:0 auto 14px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Motion flash for J/Z */
    .motionFlash {
      position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%);
      font-size:80px; font-weight:900;
      color:rgba(255,220,0,1);
      text-shadow:0 0 30px rgba(255,220,0,0.8);
      pointer-events:none;
      animation:motFade 0.8s ease-out forwards;
      z-index:200;
    }
    @keyframes motFade {
      0%  {opacity:1;transform:translate(-50%,-50%) scale(0.8);}
      40% {opacity:1;transform:translate(-50%,-50%) scale(1.1);}
      100%{opacity:0;transform:translate(-50%,-50%) scale(1);}
    }

    /* Mode toggle button */
    #modeToggle {
      position: fixed; top: 16px; right: 16px;
      background: rgba(0,0,0,0.82);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 10px; padding: 8px 18px;
      color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; z-index: 200;
      backdrop-filter: blur(10px);
      transition: border-color 0.2s;
    }
    #modeToggle:hover { border-color: #4a9eff; }
    #modeToggle.word-mode { border-color: #ffaa4a; color: #ffaa4a; }

    /* Word-sign badge */
    #wordBadge {
      position: fixed;
      top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.82);
      border: 2px solid rgba(255,170,74,0.6);
      border-radius: 12px;
      padding: 10px 32px;
      z-index: 100;
      text-align: center;
      backdrop-filter: blur(10px);
      min-width: 200px;
      display: none;
    }
    #wordLabel {
      font-size: 48px; font-weight: 900; line-height: 1;
      color: #fff; letter-spacing: 1px;
    }
    #wordConf {
      font-size: 13px; color: #ffaa4a; margin-top: 2px;
    }
    #wordStatus {
      font-size: 11px; color: #aaa; margin-top: 2px;
    }

    /* Phrase display bar */
    #phraseBar {
      position: fixed; bottom: 60px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.82);
      border-radius: 10px; padding: 10px 24px;
      font-size: 20px; font-weight: 600;
      letter-spacing: 2px; z-index: 100;
      min-width: 320px; text-align: center;
      border: 1px solid rgba(255,170,74,0.3);
      backdrop-filter: blur(8px);
      color: #ffaa4a;
      display: none;
    }

    /* Model status indicator */
    #modelStatus {
      position: fixed; bottom: 16px; right: 16px;
      font-size: 11px; color: #888; z-index: 100;
      background: rgba(0,0,0,0.6);
      border-radius: 6px; padding: 4px 10px;
      backdrop-filter: blur(6px);
    }
    #modelStatus.loaded { color: #4aff4a; }
    #modelStatus.error  { color: #ff4a4a; }
  </style>
</head>
<body>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div id="aslBadge">
  <div id="aslLetter">—</div>
  <div id="aslConf">Waiting for hand...</div>
  <div id="aslStable"></div>
  <div id="stabilityWrap"><div id="stabilityFill"></div></div>
  <div id="lastCommit"></div>
</div>

<div id="calibHint"></div>
<button id="ttsToggle" onclick="toggleTTS()">🔊 Voice</button>

<div id="debugPanel">
  <div style="color:#4a9eff;font-weight:bold;margin-bottom:6px;">ASL Debug</div>
  <div id="debugContent"><div style="color:#666">No hand detected</div></div>
</div>

<div id="historyBar" title="Recognised letters">
  <span id="historyText" style="color:#4a9eff">_ _ _</span>
</div>

<!-- Word-sign mode UI (hidden until mode toggled) -->
<div id="wordBadge">
  <div id="wordLabel">—</div>
  <div id="wordConf">Collecting frames…</div>
  <div id="wordStatus"></div>
</div>
<div id="phraseBar">…</div>
<div id="modelStatus">Word model: not loaded</div>

<button id="modeToggle" onclick="toggleMode()">Switch to Word Mode</button>

<div id="loading">
  <div class="spinner"></div>
  <div>Loading ASL model...</div>
</div>

// ═══════════════════════════════════════════════════════
// RANDOM FOREST INFERENCE
// ═══════════════════════════════════════════════════════

function rfPredict(features) {
  // Returns {label, confidence, votes}
  const votes = new Int32Array(ASL_MODEL.c.length);
  for (const tree of ASL_MODEL.t) {
    let node = 0;
    while (tree[node][0] === 0) {                      // split node
      node = features[tree[node][1]] <= tree[node][2]
           ? tree[node][3] : tree[node][4];
    }
    votes[tree[node][1]]++;                            // leaf → vote
  }
  let best = 0;
  for (let i = 1; i < votes.length; i++) if (votes[i] > votes[best]) best = i;
  return {
    label: ASL_MODEL.c[best],
    confidence: votes[best] / ASL_MODEL.t.length,
    votes
  };
}

// ═══════════════════════════════════════════════════════
// FEATURE EXTRACTION  (must mirror Python training exactly)
// landmarks = array of 21 {x, y, z} from MediaPipe
// Returns Float32Array of 23 features.
// ═══════════════════════════════════════════════════════
function extractASLFeatures(lm) {
  // ── Helpers ────────────────────────────────────────
  function norm2(a, b) {
    const dx = a.x-b.x, dy = a.y-b.y;
    return Math.sqrt(dx*dx + dy*dy);
  }
  function extScore(mcp, pip, dip, tip) {
    const ax=pip.x-mcp.x, ay=pip.y-mcp.y;
    const bx=tip.x-dip.x, by=tip.y-dip.y;
    const na=Math.sqrt(ax*ax+ay*ay), nb=Math.sqrt(bx*bx+by*by);
    if (na<1e-8||nb<1e-8) return 0.5;
    const cos=(ax*bx+ay*by)/(na*nb);
    return (Math.max(-1,Math.min(1,cos))+1)/2;
  }

  // ── Normalise: wrist to origin, scale by palm width ─
  const wrist = lm[0];
  const palmW = norm2(lm[5], lm[17]);
  const s = palmW < 1e-8 ? 1 : palmW;

  function P(i) {                                       // normalised point
    return { x:(lm[i].x-wrist.x)/s, y:(lm[i].y-wrist.y)/s };
  }
  function L(i) { const p=P(i); return Math.sqrt(p.x*p.x+p.y*p.y); }
  function D(i,j) {
    const pi=P(i),pj=P(j);
    return Math.sqrt((pi.x-pj.x)**2+(pi.y-pj.y)**2);
  }

  // ── Extension scores (cosine-angle at joints) ───────
  const eT = extScore(P(1),P(2),P(3),P(4));
  const eI = extScore(P(5),P(6),P(7),P(8));
  const eM = extScore(P(9),P(10),P(11),P(12));
  const eR = extScore(P(13),P(14),P(15),P(16));
  const eP = extScore(P(17),P(18),P(19),P(20));

  // ── Normalised tip-to-wrist distances ───────────────
  const dT=L(4), dI=L(8), dM=L(12), dR=L(16), dP_=L(20);

  // ── Adjacent inter-tip distances ────────────────────
  const dIT=D(8,4), dMI=D(12,8), dRM=D(16,12), dPR=D(20,16);

  // ── Thumb proximity (key for A/S/T/M/N/E cluster) ───
  const dThI=D(4,5);    // thumb tip → index MCP
  const dThM=D(4,9);    // thumb tip → middle MCP
  const dThW=L(4);      // thumb tip from wrist (same as dT but alias)

  // ── Pointing direction (resolves D/P, G/H/Q) ────────
  const ip=P(8), imcp=P(5);
  const ivx=ip.x-imcp.x, ivy=ip.y-imcp.y;
  const iln=Math.sqrt(ivx*ivx+ivy*ivy)||1;
  const idx_dy=ivy/iln, idx_dx=ivx/iln;

  // ── Palm facing direction ────────────────────────────
  const mm=P(9); const pln=Math.sqrt(mm.x*mm.x+mm.y*mm.y)||1;
  const palm_dy=mm.y/pln;

  // ── Thumb y relative to MCPs (fist thumb position) ──
  const p4=P(4), p5=P(5), p9=P(9);
  const tyri=p4.y-p5.y;    // thumb above/below index MCP
  const tyrm=p4.y-p9.y;    // thumb above/below middle MCP

  // ── Index-middle crossing (detects R) ───────────────
  const sep=D(5,9)||1;
  const cross_im=D(8,12)/sep;

  return [
    eT,eI,eM,eR,eP,
    dT,dI,dM,dR,dP_,
    dIT,dMI,dRM,dPR,
    dThI,dThM,dThW,
    idx_dy,idx_dx,palm_dy,
    tyri,tyrm,cross_im
  ];
}

// ═══════════════════════════════════════════════════════
// DIGIT & MOTION LETTER RULES
// (not in Aqua1907 training data → rule-based overlay)
// ═══════════════════════════════════════════════════════
function digitRules(lm) {
  // Returns digit string '0'–'9' or null.
  // Uses the same normalised feature helpers.
  const wrist=lm[0];
  const palmW=Math.sqrt((lm[5].x-lm[17].x)**2+(lm[5].y-lm[17].y)**2)||1;
  function P(i){ return {x:(lm[i].x-wrist.x)/palmW, y:(lm[i].y-wrist.y)/palmW}; }
  function L(i){ const p=P(i); return Math.sqrt(p.x*p.x+p.y*p.y); }
  function D(i,j){ const a=P(i),b=P(j); return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2); }
  function extScore(mcp,pip,dip,tip){
    const ax=pip.x-mcp.x,ay=pip.y-mcp.y,bx=tip.x-dip.x,by=tip.y-dip.y;
    const na=Math.sqrt(ax*ax+ay*ay),nb=Math.sqrt(bx*bx+by*by);
    if(na<1e-8||nb<1e-8)return 0.5;
    return (Math.max(-1,Math.min(1,(ax*bx+ay*by)/(na*nb)))+1)/2;
  }

  const eT=extScore(P(1),P(2),P(3),P(4));
  const eI=extScore(P(5),P(6),P(7),P(8));
  const eM=extScore(P(9),P(10),P(11),P(12));
  const eR=extScore(P(13),P(14),P(15),P(16));
  const eP=extScore(P(17),P(18),P(19),P(20));

  const dI=L(8), dM=L(12), dR=L(16), dP_=L(20);

  // ── Thumb extension: are thumb+index tips close? ─────
  const dThumbIndex=D(4,8);    // thumb-index tip gap
  const dThumbMiddle=D(4,12);

  // Count clearly extended fingers (score > 0.65)
  const extCount=[eI,eM,eR,eP].filter(e=>e>0.65).length;

  // 5: all five fully open
  if(eT>0.55&&eI>0.7&&eM>0.7&&eR>0.65&&eP>0.65) return '5';
  // 4: four fingers up, thumb tucked
  if(eT<0.45&&eI>0.7&&eM>0.7&&eR>0.65&&eP>0.65) return '4';
  // 0: O-shape — all fingers curved, tips close to thumb
  if(eI<0.55&&eM<0.55&&eR<0.55&&dThumbIndex<0.8&&dThumbMiddle<0.9) return '0';
  // 1: only index extended, no O formation (thumb away)
  if(eI>0.72&&eM<0.38&&eR<0.38&&eP<0.38&&dThumbIndex>1.0) return '1';
  // 2: index+middle spread, others curled
  if(eI>0.65&&eM>0.65&&eR<0.45&&eP<0.45&&D(8,12)>0.6) return '2';
  // 3: index+middle+ring, pinky curled, spread
  if(eI>0.65&&eM>0.65&&eR>0.6&&eP<0.45) return '3';
  // 6: middle+ring+pinky, index near thumb
  if(eI<0.5&&eM>0.6&&eR>0.6&&eP>0.6&&D(4,8)<0.7) return '6';
  // 7: index+middle+ring down, pinky+... complex — skip for now
  // 8: middle+index in circle, others extended
  if(D(4,12)<0.5&&eI>0.5&&eR>0.6&&eP>0.6) return '8';
  // 9: index+thumb circle, others up
  if(D(4,8)<0.5&&eM>0.6&&eR>0.6&&eP>0.6) return '9';
  // 7: thumb+index+middle touch forming triangle, ring+pinky extended
  if(D(4,8)<0.7&&D(4,12)<0.7&&eR>0.6&&eP>0.6) return '7';

  return null;
}

function smoothPredict(rawLabel, rfConf, votes) {
  const now = Date.now();

  // Rolling buffer
  predBuf.push({ label: rawLabel, conf: rfConf });
  if (predBuf.length > CFG.BUFFER_SIZE) predBuf.shift();

  // Majority vote over buffer
  const counts = {};
  for (const p of predBuf) counts[p.label] = (counts[p.label] || 0) + 1;
  let best = rawLabel, bestCount = 0;
  for (const [l, c] of Object.entries(counts)) { if (c > bestCount) { bestCount = c; best = l; } }
  const majority = bestCount / predBuf.length;

  // Top-2 vote margin from current-frame RF votes
  let top2margin = 1.0;
  if (votes) {
    const total = ASL_MODEL.t.length;
    const sorted = Array.from(votes).sort((a, b) => b - a);
    top2margin = sorted.length >= 2 ? (sorted[0] - sorted[1]) / total : 1.0;
  }

  // Stability clock: reset when candidate changes
  if (best !== stableCandidate) { stableCandidate = best; stableStartTime = now; }
  const heldMs   = now - stableStartTime;
  const progress = Math.min(1, heldMs / CFG.STABLE_MS);

  // Gate checks
  const confOk   = rfConf  >= CFG.MIN_CONFIDENCE;
  const marginOk = top2margin >= CFG.TOP2_MARGIN;
  const stableOk = heldMs  >= CFG.STABLE_MS;
  const coolOk   = (now - lastCommitTime) >= CFG.COOLDOWN_MS;

  let committed = false;
  if (stableOk && confOk && marginOk && coolOk) {
    confirmedLetter = best;
    lastCommitTime  = now;
    committed       = true;
  }

  return { candidate: best, confirmed: confirmedLetter, majority,
           rfConf, heldMs, progress, top2margin, confOk, marginOk, committed };
}

// ═══════════════════════════════════════════════════════
// J / Z MOTION DETECTION
// J: pinky traces downward arc  → pinky_x reverses direction
// Z: index traces Z-path        → rapid left–right–left
// ═══════════════════════════════════════════════════════
let lastJZTime = 0;
let detectedMotionLetter = null;
let motionDisplayUntil = 0;

function updateMotionTrails(lm) {
  const ix = lm[8].x, iy = lm[8].y, px = lm[20].x;

  indexTrailX.push(ix); indexTrailY.push(iy); pinkyTrailX.push(px);
  if (indexTrailX.length > TRAIL_LEN) { indexTrailX.shift(); indexTrailY.shift(); pinkyTrailX.shift(); }

  if (indexTrailX.length < TRAIL_LEN) return null;

  const now = Date.now();
  if (now - lastJZTime < 800) return null;  // cooldown

  // ── Detect J: pinky traces a J-shape ──────────────
  // Pinky x first moves one direction then reverses (curve at bottom)
  const pMid = pinkyTrailX[Math.floor(TRAIL_LEN/2)];
  const pStart = pinkyTrailX.slice(0,4).reduce((a,b)=>a+b)/4;
  const pEnd   = pinkyTrailX.slice(-4).reduce((a,b)=>a+b)/4;
  const pReversed = (pEnd - pMid) * (pMid - pStart) < -0.002;

  // Downward net motion of index tip (J curves down then hooks)
  const iyStart = indexTrailY.slice(0,4).reduce((a,b)=>a+b)/4;
  const iyEnd   = indexTrailY.slice(-4).reduce((a,b)=>a+b)/4;
  const downMotion = iyEnd - iyStart > 0.04;   // y increases = moves down

  if (pReversed && downMotion) {
    lastJZTime = now; return 'J';
  }

  // ── Detect Z: index tip makes rapid horizontal reversals ──
  let zDirChanges = 0;
  for (let i = 1; i < indexTrailX.length-1; i++) {
    const prev = indexTrailX[i] - indexTrailX[i-1];
    const next = indexTrailX[i+1] - indexTrailX[i];
    if (Math.abs(prev) > 0.008 && prev * next < 0) zDirChanges++;
  }
  const xRange = Math.max(...indexTrailX) - Math.min(...indexTrailX);
  if (zDirChanges >= 2 && xRange > 0.06) {
    lastJZTime = now; return 'Z';
  }

  return null;
}

// ═══════════════════════════════════════════════════════
// LETTER HISTORY (bottom bar)
// ═══════════════════════════════════════════════════════
const letterHistory = [];
let lastAddedLetter = null;
let lastAddTime     = 0;

// Central commit point — all letter confirmations go through here.
function commitLetter(letter) {
  if (!letter || letter === '—') return;
  const now = Date.now();
  // Deduplicate: same letter within cooldown window → skip
  if (letter === lastAddedLetter && now - lastAddTime < CFG.COOLDOWN_MS) return;
  lastAddedLetter = letter;
  lastAddTime     = now;
  letterHistory.push(letter);
  if (letterHistory.length > 12) letterHistory.shift();
  document.getElementById('historyText').textContent = letterHistory.join(' ') || '_ _ _';
  speakLetter(letter);
  const lc = document.getElementById('lastCommit');
  if (lc) lc.textContent = `Last: ${letter}${ttsEnabled ? '  🔊' : ''}`;
}

// J/Z motion path still uses this shim
function maybeAddToHistory(letter) { commitLetter(letter); }

// ── Text-to-speech ─────────────────────────────────────────────────────────
let ttsEnabled = CFG.TTS_ENABLED_DEFAULT;

function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById('ttsToggle');
  if (btn) {
    btn.textContent = ttsEnabled ? '🔊 Voice' : '🔇 Voice';
    btn.classList.toggle('on', ttsEnabled);
  }
  if (!ttsEnabled) window.speechSynthesis && window.speechSynthesis.cancel();
}

function speakLetter(letter) {
  if (!ttsEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();              // drop any queued utterance
  const u    = new SpeechSynthesisUtterance(letter);
  u.rate     = 0.85;
  u.pitch    = 1.0;
  u.volume   = 1.0;
  window.speechSynthesis.speak(u);
}

// Initialise TTS button state on load
window.addEventListener('load', () => {
  const btn = document.getElementById('ttsToggle');
  if (btn) btn.classList.toggle('on', ttsEnabled);
});

// ═══════════════════════════════════════════════════════
// HAND CONNECTIONS (for skeleton drawing)
// ═══════════════════════════════════════════════════════
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17]
];

const FINGER_COLORS = [
  '#ff6b6b','#ff6b6b','#ff6b6b','#ff6b6b','#ff6b6b',  // thumb
  '#4aff4a','#4aff4a','#4aff4a','#4aff4a',              // index
  '#4a9eff','#4a9eff','#4a9eff','#4a9eff',              // middle
  '#ff4aff','#ff4aff','#ff4aff','#ff4aff',              // ring
  '#ffaa4a','#ffaa4a','#ffaa4a','#ffaa4a'               // pinky
];

// ═══════════════════════════════════════════════════════
// WORD-SIGN MODE  (Steps F + G)
// ═══════════════════════════════════════════════════════

const WORD_CLASSES   = ['hello', 'how', 'how_are_you', 'you', 'today'];
const WORD_SEQ_LEN   = 30;      // must match extract_sequences.py --seq-len
const WORD_FEAT_DIM  = 63;      // 21 landmarks × 3 (x,y,z), wrist-centred + palm-scaled
const WORD_CONF_THR  = 0.60;    // minimum softmax confidence to accept a prediction
const WORD_COOLDOWN  = 2000;    // ms to ignore new predictions after a confirmed word
const PALM_A = 5, PALM_B = 17;  // landmark indices for palm-width normalisation

// State
let wordMode     = false;
let wordModel    = null;        // tf.LayersModel once loaded
let wordBuffer   = [];          // rolling window: Array of Float32Array(WORD_FEAT_DIM)
let phraseTokens = [];          // confirmed word tokens
let wordCooldownUntil = 0;

// ── Feature extraction (mirrors extract_sequences.py) ─────────────────────
function extractWordFeatures(lm) {
  const wrist = [lm[0].x, lm[0].y, lm[0].z];
  const pa    = [lm[PALM_A].x, lm[PALM_A].y, lm[PALM_A].z];
  const pb    = [lm[PALM_B].x, lm[PALM_B].y, lm[PALM_B].z];
  const palmW = Math.hypot(pa[0]-pb[0], pa[1]-pb[1], pa[2]-pb[2]);

  const feat = new Float32Array(WORD_FEAT_DIM);
  if (palmW < 1e-4) return feat;  // degenerate hand → zero vector

  for (let i = 0; i < 21; i++) {
    feat[i*3]   = (lm[i].x - wrist[0]) / palmW;
    feat[i*3+1] = (lm[i].y - wrist[1]) / palmW;
    feat[i*3+2] = (lm[i].z - wrist[2]) / palmW;
  }
  return feat;
}

// ── Resample buffer to fixed SEQ_LEN ─────────────────────────────────────
function resampleBuffer(buf) {
  const T = buf.length;
  const out = new Float32Array(WORD_SEQ_LEN * WORD_FEAT_DIM);
  if (T === 0) return out;

  for (let i = 0; i < WORD_SEQ_LEN; i++) {
    const srcIdx = T >= WORD_SEQ_LEN
      ? Math.round(i * (T - 1) / (WORD_SEQ_LEN - 1))
      : i;                                               // end-pad with zeros
    if (srcIdx < T) {
      out.set(buf[srcIdx], i * WORD_FEAT_DIM);
    }
  }
  return out;
}

// ── GRU inference via TF.js ───────────────────────────────────────────────
async function inferWord() {
  if (!wordModel) return null;
  if (wordBuffer.length < 5) return null;               // too few frames yet

  const flat = resampleBuffer(wordBuffer);
  const input = tf.tensor3d(flat, [1, WORD_SEQ_LEN, WORD_FEAT_DIM]);
  const logits = wordModel.predict(input);
  const probs  = await tf.softmax(logits).data();
  input.dispose(); logits.dispose();

  let best = 0;
  for (let i = 1; i < probs.length; i++) if (probs[i] > probs[best]) best = i;
  return { label: WORD_CLASSES[best], confidence: probs[best], probs: Array.from(probs) };
}

// ── Phrase assembler ──────────────────────────────────────────────────────
function addWordToPhrase(word) {
  const last = phraseTokens[phraseTokens.length - 1];
  if (last === word) return;           // debounce duplicate consecutive words
  phraseTokens.push(word);
  if (phraseTokens.length > 8) phraseTokens.shift();
  updatePhraseBar();
}

function updatePhraseBar() {
  const bar = document.getElementById('phraseBar');
  bar.textContent = phraseTokens.length ? phraseTokens.join(' ') : '…';
}

// ── Load TF.js model ──────────────────────────────────────────────────────
async function loadWordModel() {
  const statusEl = document.getElementById('modelStatus');
  try {
    wordModel = await tf.loadLayersModel('model/word_gru/model.json');
    statusEl.textContent = 'Word model: loaded ✓';
    statusEl.className   = 'loaded';
    log.info && log.info('Word GRU model loaded');
  } catch (e) {
    statusEl.textContent = 'Word model: not found (train first)';
    statusEl.className   = 'error';
    // Not fatal — word mode works as soon as model is placed in model/word_gru/
  }
}

// ── Mode toggle ───────────────────────────────────────────────────────────
function toggleMode() {
  wordMode = !wordMode;
  const btn      = document.getElementById('modeToggle');
  const aslBadge = document.getElementById('aslBadge');
  const wordBadge= document.getElementById('wordBadge');
  const histBar  = document.getElementById('historyBar');
  const phraseBar= document.getElementById('phraseBar');

  if (wordMode) {
    btn.textContent = 'Switch to Letter Mode';
    btn.classList.add('word-mode');
    aslBadge.style.display  = 'none';
    histBar.style.display   = 'none';
    wordBadge.style.display = 'block';
    phraseBar.style.display = 'block';
    wordBuffer = [];
    phraseTokens = [];
    updatePhraseBar();
    if (!wordModel) loadWordModel();
  } else {
    btn.textContent = 'Switch to Word Mode';
    btn.classList.remove('word-mode');
    aslBadge.style.display  = 'block';
    histBar.style.display   = 'block';
    wordBadge.style.display = 'none';
    phraseBar.style.display = 'none';
    wordBuffer = [];
  }
}

// ═══════════════════════════════════════════════════════
// MAIN PROCESSING — called every MediaPipe frame
// ═══════════════════════════════════════════════════════
const state = {
  videoDisplayWidth: 640, videoDisplayHeight: 480,
  cameraActive: false, dpr: 1
};

function onHandResults(results) {
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  const W = state.videoDisplayWidth, H = state.videoDisplayHeight;

  ctx.clearRect(0, 0, W, H);

  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    if (wordMode) {
      // Push zero vector so sequence isn't artificially short during occlusion
      wordBuffer.push(new Float32Array(WORD_FEAT_DIM));
      if (wordBuffer.length > WORD_SEQ_LEN * 3) wordBuffer.shift();
      document.getElementById('wordLabel').textContent = '—';
      document.getElementById('wordConf').textContent  = 'No hand detected';
      document.getElementById('wordStatus').textContent = '';
    } else {
      // Reset stability when hand absent long enough (blank gate)
      if (Date.now() - lastHandTime > CFG.NO_HAND_RESET_MS) {
        stableCandidate = null;
        stableStartTime = 0;
        lastCommitTime  = 0;   // waive cooldown → next sign commits promptly
        predBuf.length  = 0;
        document.getElementById('stabilityFill').style.width = '0%';
        document.getElementById('calibHint').classList.remove('show');
      }
      document.getElementById('aslLetter').textContent = '—';
      document.getElementById('aslConf').textContent   = 'No hand detected';
      document.getElementById('aslConf').style.color   = '#888';
      document.getElementById('aslStable').textContent = '';
      document.getElementById('debugContent').innerHTML =
        '<div style="color:#666">No hand detected</div>';
    }
    // Clear motion trails
    indexTrailX=[]; indexTrailY=[]; pinkyTrailX=[];
    return;
  }

  // Use first detected hand
  const lm = results.multiHandLandmarks[0];

  // ── Draw skeleton ─────────────────────────────────
  ctx.save();
  ctx.translate(W, 0); ctx.scale(-1, 1);   // mirror to match mirrored video

  ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (const [s, e] of HAND_CONNECTIONS) {
    const color = FINGER_COLORS[Math.max(s,e)] || '#4a9eff';
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.moveTo(lm[s].x*W, lm[s].y*H);
    ctx.lineTo(lm[e].x*W, lm[e].y*H);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  lm.forEach((p, i) => {
    const r = i === 0 ? 7 : 4;
    ctx.fillStyle = FINGER_COLORS[i] || '#4a9eff';
    ctx.beginPath(); ctx.arc(p.x*W, p.y*H, r, 0, 2*Math.PI); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x*W, p.y*H, r, 0, 2*Math.PI); ctx.stroke();
  });
  ctx.restore();

  // ── WORD-SIGN MODE branch ─────────────────────────
  if (wordMode) {
    const wfeat = extractWordFeatures(lm);
    wordBuffer.push(wfeat);
    if (wordBuffer.length > WORD_SEQ_LEN * 3) wordBuffer.shift();  // cap buffer

    const wordEl   = document.getElementById('wordLabel');
    const wconfEl  = document.getElementById('wordConf');
    const wstatEl  = document.getElementById('wordStatus');

    if (!wordModel) {
      wordEl.textContent  = '—';
      wconfEl.textContent = 'Model not loaded';
      wstatEl.textContent = 'Place model in model/word_gru/model.json';
    } else {
      const framePct = Math.min(100, Math.round(wordBuffer.length / WORD_SEQ_LEN * 100));
      wstatEl.textContent = framePct < 100
        ? `Collecting… ${framePct}%`
        : `Window full (${wordBuffer.length} frames)`;

      if (Date.now() > wordCooldownUntil) {
        inferWord().then(res => {
          if (!res) return;
          const pct = Math.round(res.confidence * 100);
          wordEl.textContent  = res.label.replace('_', ' ');
          wconfEl.textContent = `Confidence: ${pct}%`;
          wconfEl.style.color = pct >= 70 ? '#4aff4a' : pct >= 50 ? '#ffaa4a' : '#ff4a4a';

          if (res.confidence >= WORD_CONF_THR) {
            addWordToPhrase(res.label);
            wordCooldownUntil = Date.now() + WORD_COOLDOWN;
            wordBuffer = [];  // reset window after confirmed sign
          }
        });
      }
    }
    return;   // skip letter-mode pipeline below
  }

  // ── Feature extraction ────────────────────────────
  const features = extractASLFeatures(lm);

  // ── RF classification (24 letters A-X + Y) ───────
  const rfResult = rfPredict(features);

  // ── Digit override ────────────────────────────────
  // Digits share some shapes with letters, so try digit rules first.
  // If confidence is high use RF letter, otherwise also check digits.
  const digit = digitRules(lm);

  // ── Motion letter detection (J, Z) ───────────────
  const motionLetter = updateMotionTrails(lm);
  if (motionLetter) {
    detectedMotionLetter = motionLetter;
    motionDisplayUntil = Date.now() + 1200;
    showMotionFlash(motionLetter);
  }

  lastHandTime = Date.now();  // track hand presence for blank-gate reset

  // ── H disambiguation ─────────────────────────────
  // H: index+middle point horizontally (sideways).
  // U/V: index+middle point vertically (upward).
  // Feature idx_dx (feat[18]) = horizontal pointing; idx_dy (feat[17]) = vertical.
  // When RF says H but fingers point more vertically, check if U or V has
  // meaningful votes and prefer them; otherwise penalise H confidence.
  let rawLabel     = rfResult.label;
  let useConf      = rfResult.confidence;
  let hAmbiguous   = false;

  if (rawLabel === 'H') {
    const idx_dx = features[18];
    const idx_dy = features[17];
    // H needs strong horizontal component: |dx| should dominate |dy|
    if (Math.abs(idx_dy) > Math.abs(idx_dx)) {
      hAmbiguous = true;
      const N    = ASL_MODEL.t.length;
      const hIdx = ASL_MODEL.c.indexOf('H');
      const uIdx = ASL_MODEL.c.indexOf('U');
      const vIdx = ASL_MODEL.c.indexOf('V');
      const hV   = rfResult.votes[hIdx] || 0;
      const uV   = uIdx >= 0 ? (rfResult.votes[uIdx] || 0) : 0;
      const vV   = vIdx >= 0 ? (rfResult.votes[vIdx] || 0) : 0;
      if (uV >= hV * 0.55) {
        rawLabel = 'U'; useConf = uV / N;
      } else if (vV >= hV * 0.55) {
        rawLabel = 'V'; useConf = vV / N;
      } else {
        useConf *= 0.65;  // penalise: geometry says not H, but no strong alternative
      }
    }
  }

  // ── Digit override ────────────────────────────────
  const digitOverride = digit && rfResult.confidence < 0.55;
  if (digitOverride) {
    rawLabel = digit;
    useConf  = 0.6;
  }

  const smooth = smoothPredict(rawLabel, useConf, digitOverride ? null : rfResult.votes);
  const displayLetter = smooth.candidate || '—';

  // ── Commit on stability ───────────────────────────
  if (smooth.committed) commitLetter(smooth.candidate);

  // ── Update main badge ─────────────────────────────
  const letterEl  = document.getElementById('aslLetter');
  const confEl    = document.getElementById('aslConf');
  const stableEl  = document.getElementById('aslStable');
  const fillEl    = document.getElementById('stabilityFill');
  const calibEl   = document.getElementById('calibHint');

  // Motion letter takes over badge temporarily
  if (Date.now() < motionDisplayUntil && detectedMotionLetter) {
    letterEl.textContent = detectedMotionLetter;
    confEl.textContent   = 'Motion gesture';
    confEl.style.color   = '#ffdd00';
    stableEl.textContent = '';
    if (fillEl) fillEl.style.width = '0%';
    maybeAddToHistory(detectedMotionLetter);
  } else {
    letterEl.textContent = displayLetter;
    const pct = Math.round(smooth.rfConf * 100);
    confEl.textContent   = `Confidence: ${pct}%${hAmbiguous ? '  ⚠ H?' : ''}`;
    confEl.style.color   = pct >= 65 ? '#4aff4a' : pct >= 45 ? '#ffaa4a' : '#ff4a4a';

    // Stability progress bar
    if (fillEl) {
      fillEl.style.width      = Math.round(smooth.progress * 100) + '%';
      fillEl.style.background = smooth.progress >= 1
        ? (smooth.confOk && smooth.marginOk ? '#4aff4a' : '#ffaa4a')
        : '#4a9eff';
    }

    // Status text
    const remaining = Math.max(0, CFG.STABLE_MS - smooth.heldMs);
    if (smooth.progress >= 1 && smooth.confOk && smooth.marginOk) {
      stableEl.textContent = `✓ Committed  (${(smooth.majority*100)|0}% majority)`;
      stableEl.style.color = '#4aff4a';
    } else if (smooth.heldMs > 80) {
      stableEl.textContent = `Hold ${(remaining/1000).toFixed(1)}s…`;
      stableEl.style.color = '#aaa';
    } else {
      stableEl.textContent = '';
    }
  }

  // ── Calibration hint ──────────────────────────────
  let hint = '';
  if (smooth.heldMs > 350) {
    if (!smooth.marginOk)    hint = 'Hold steady — pose unclear';
    else if (!smooth.confOk) hint = 'Move hand to centre';
    else if (smooth.majority < 0.5) hint = 'Rotate hand slightly';
  }
  if (hAmbiguous && rfResult.label === 'H') hint = 'Point fingers sideways for H';
  if (calibEl) { calibEl.textContent = hint; calibEl.classList.toggle('show', hint !== ''); }

  // ── Debug panel ───────────────────────────────────
  const feats = features;
  const names = ['eT','eI','eM','eR','eP'];
  const extBar = names.map((n,i) => {
    const v = feats[i];
    const col = v>0.65?'#4aff4a':v>0.4?'#ffaa4a':'#ff4a4a';
    return `<span style="color:${col}">${n}:${v.toFixed(2)}</span>`;
  }).join(' ');

  // Top-3 RF predictions
  const sortedVotes = ASL_MODEL.c.map((c,i)=>({c,v:rfResult.votes[i]}))
      .sort((a,b)=>b.v-a.v).slice(0,3);
  const top3 = sortedVotes.map(e=>`${e.c}:${Math.round(e.v/ASL_MODEL.t.length*100)}%`).join('  ');

  const marginPct = Math.round(smooth.top2margin * 100);
  const marginCol = smooth.marginOk ? '#4aff4a' : '#ff4a4a';
  document.getElementById('debugContent').innerHTML = `
    <div class="dbRow"><span class="dbKey">Raw RF:</span><span class="dbVal">${rfResult.label} (${Math.round(rfResult.confidence*100)}%)${hAmbiguous?' ⚠H':''}</span></div>
    <div class="dbRow"><span class="dbKey">Candidate:</span><span class="dbVal">${displayLetter} (${Math.round(smooth.majority*100)}% buf)</span></div>
    <div class="dbRow"><span class="dbKey">Stability:</span><span class="dbVal">${smooth.heldMs}ms / ${CFG.STABLE_MS}ms</span></div>
    <div class="dbRow"><span class="dbKey">Top-2 gap:</span><span style="color:${marginCol};font-weight:bold">${marginPct}% (need ${CFG.TOP2_MARGIN*100|0}%)</span></div>
    <div class="dbRow"><span class="dbKey">Digit?</span><span class="dbVal">${digit||'—'}</span></div>
    <div class="dbRow"><span class="dbKey">Motion:</span><span class="dbVal">${detectedMotionLetter&&Date.now()<motionDisplayUntil?detectedMotionLetter:'—'}</span></div>
    <div style="margin:4px 0;font-size:10px">Ext: ${extBar}</div>
    <div class="dbRow" style="font-size:10px"><span class="dbKey">Top-3:</span><span style="color:#aaa">${top3}</span></div>
    <div class="dbRow" style="font-size:10px"><span class="dbKey">idxDX:</span><span style="color:#aaa">${feats[18].toFixed(2)}</span>
      <span class="dbKey">idxDY:</span><span style="color:#aaa">${feats[17].toFixed(2)}</span></div>
    <div class="dbRow" style="font-size:10px"><span class="dbKey">dThI:</span><span style="color:#aaa">${feats[14].toFixed(2)}</span>
      <span class="dbKey">cross:</span><span style="color:#aaa">${feats[22].toFixed(2)}</span></div>
  `;
}

// ═══════════════════════════════════════════════════════
// MOTION FLASH (J / Z)
// ═══════════════════════════════════════════════════════
function showMotionFlash(letter) {
  const el = document.createElement('div');
  el.className = 'motionFlash';
  el.textContent = letter;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// ═══════════════════════════════════════════════════════
// CAMERA & MEDIAPIPE SETUP
// ═══════════════════════════════════════════════════════
async function setupCamera() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 1280, height: 720 }
    });
    video.srcObject = stream;
    await video.play();

    await new Promise(resolve => {
      if (video.readyState >= 2) resolve();
      else video.addEventListener('loadedmetadata', resolve, { once: true });
    });

    const vW = video.videoWidth, vH = video.videoHeight;
    const vAR = vW/vH, winAR = window.innerWidth/window.innerHeight;
    let dW, dH;
    if (vAR > winAR) { dH = window.innerHeight; dW = dH * vAR; }
    else             { dW = window.innerWidth;   dH = dW / vAR; }

    const dpr = window.devicePixelRatio || 1;
    state.videoDisplayWidth = dW;
    state.videoDisplayHeight = dH;
    state.dpr = dpr;
    state.cameraActive = true;

    canvas.width  = Math.round(dW * dpr);
    canvas.height = Math.round(dH * dpr);
    canvas.style.width  = dW + 'px';
    canvas.style.height = dH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    return true;
  } catch (err) {
    console.error('Camera error:', err);
    alert('Camera access denied. Please allow camera access and reload.');
    return false;
  }
}

async function init() {
  const ok = await setupCamera();
  if (!ok) return;

  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.65,
    minTrackingConfidence: 0.65
  });
  hands.onResults(onHandResults);

  const camera = new Camera(document.getElementById('video'), {
    onFrame: async () => await hands.send({ image: document.getElementById('video') }),
    width: 1280, height: 720
  });
  camera.start();

  document.getElementById('loading').remove();
}

// ── Resize handler ──────────────────────────────────
window.addEventListener('resize', () => {
  if (!state.cameraActive) return;
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const vAR = video.videoWidth/video.videoHeight||16/9;
  const winAR = window.innerWidth/window.innerHeight;
  let dW, dH;
  if (vAR > winAR) { dH=window.innerHeight; dW=dH*vAR; }
  else             { dW=window.innerWidth; dH=dW/vAR; }
  const dpr=window.devicePixelRatio||1;
  state.videoDisplayWidth=dW; state.videoDisplayHeight=dH; state.dpr=dpr;
  canvas.width=Math.round(dW*dpr); canvas.height=Math.round(dH*dpr);
  canvas.style.width=dW+'px'; canvas.style.height=dH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
});

// ── Keyboard: Backspace clears history ──────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Backspace') {
    letterHistory.length = 0;
    document.getElementById('historyText').textContent = '_ _ _';
  }
});

init();
</script>
